<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#022c22" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#gradBg)"/>
  
  <!-- Decorative circles in safe zone -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  
  <!-- Wallet / Card Icon Container -->
  <g filter="url(#shadow)">
    <!-- Base Wallet Shape -->
    <rect x="116" y="156" width="280" height="200" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    
    <!-- Wallet flap / header band -->
    <path d="M116 196 C 116 174, 134 156, 156 156 L 356 156 C 378 156, 396 174, 396 196 L 396 220 L 116 220 Z" fill="#10b981"/>
    
    <!-- Accent Line -->
    <line x1="140" y1="188" x2="220" y2="188" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
    
    <!-- Wallet Clasp / Badge -->
    <rect x="310" y="234" width="76" height="44" rx="22" fill="#047857"/>
    <circle cx="348" cy="256" r="10" fill="#fcd34d"/>
    
    <!-- Rupiah / Coin symbol -->
    <g transform="translate(196, 276)">
      <circle cx="0" cy="0" r="38" fill="#10b981" fill-opacity="0.15"/>
      <text x="0" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#047857" text-anchor="middle">Rp</text>
    </g>
    
    <!-- Growth Arrow / Trend -->
    <path d="M156 316 L 190 286 L 220 306 L 270 256" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="252,256 270,256 270,274" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
